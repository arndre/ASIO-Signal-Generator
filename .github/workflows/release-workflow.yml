# Test workflow: builds and packages a .NET project and (optionally) creates a GitHub Release (Windows).
name: Test Build & Package (.NET) - Manual (Windows)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Set to "true" to actually create a GitHub Release (default: false)'
        required: false
        default: 'false'
      dotnet_version:
        description: 'Dotnet SDK version to use'
        required: false
        default: '7.0.x'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ github.event.inputs.dotnet_version }}

      - name: Set release tag (Windows)
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ")
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build -o ./release/publish

      - name: Package artifact (Windows)
        shell: pwsh
        run: |
          $out = "./release/artifact-$env:TAG.zip"
          if (Test-Path $out) { Remove-Item $out }
          Compress-Archive -Path ./release/publish/* -DestinationPath $out

      - name: Upload build artifact (Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ env.TAG }}
          path: ./release/artifact-${{ env.TAG }}.zip

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: Release ${{ env.TAG }}
          body: |
            Automated test release created from commit ${{ github.sha }} by workflow ${{ github.workflow }}
          draft: false
          prerelease: false

      - name: Upload release asset(s)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/artifact-${{ env.TAG }}.zip
          asset_name: artifact-${{ env.TAG }}.zip
          asset_content_type: application/zip