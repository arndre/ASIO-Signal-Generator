# Test workflow: builds and packages a .NET project and (optionally) creates a GitHub Release (Windows).
name: Build & Package (.NET) - Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ github.event.inputs.dotnet_version }}

      - name: Set release tag (Windows)
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ")
          # repository name only (owner/repo is in GITHUB_REPOSITORY)
          $repo = $env:GITHUB_REPOSITORY.Split('/')[-1]
          # choose platform/runtime label for the artifact (adjust if you publish other RIDs)
          $rid = 'win-x64'
          $artifactBase = "$repo-$tag-$rid"
          $zipPath = "./release/$artifactBase.zip"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_BASE=$artifactBase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build -o ./release/publish

      - name: Package artifact (Windows)
        shell: pwsh
        run: |
          if (Test-Path $env:ARTIFACT_ZIP) { Remove-Item $env:ARTIFACT_ZIP }
          Compress-Archive -Path ./release/publish/* -DestinationPath $env:ARTIFACT_ZIP

      - name: Upload build artifact (Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ env.ARTIFACT_ZIP }}

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: Release ${{ env.TAG }}
          body: |
            Automated test release created from commit ${{ github.sha }} by workflow ${{ github.workflow }}
          draft: false
          prerelease: false

      - name: Upload release asset(s)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ARTIFACT_ZIP }}
          asset_name: ${{ env.ARTIFACT_BASE }}.zip
          asset_content_type: application/zip
